[workspace]
members = ["crates/pymab-core", "crates/pymab-python"]
resolver = "2"

[workspace.package]
version = "2.0.0"
authors = ["Daniela Lopes <danielalopes_97@hotmail.com>"]
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/danielaLopes/pymab"
homepage = "https://github.com/danielaLopes/pymab"

[workspace.dependencies]
blake2 = "0.10.6"
numpy = "0.29.0"
pyo3 = "0.29.2"
rand = "0.9.2"
rand_chacha = "0.9.0"
