[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymab"
version = "1.0.0"
description = "Reproducible multi-armed bandit experiments for Python."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Daniela Lopes", email = "danielalopes_97@hotmail.com"}]
keywords = ["reinforcement-learning", "bandits", "experimentation", "data-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["plotly>=5.0", "matplotlib>=3.7"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0"]
dev = [
    "bandit>=1.8",
    "build>=1.2",
    "mypy>=1.8",
    "pip-audit>=2.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
analysis = [
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "build>=1.2",
    "mypy>=1.8",
    "pip-audit>=2.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/danielaLopes/pymab"
Repository = "https://github.com/danielaLopes/pymab"
Issues = "https://github.com/danielaLopes/pymab/issues"

[tool.setuptools.packages.find]
include = ["pymab*"]
exclude = ["tests*", "docs*", "examples*", "results*"]

[tool.setuptools.package-data]
pymab = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "S"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pymab --cov-report=term-missing"
