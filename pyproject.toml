[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "pymab"
dynamic = ["version"]
description = "Reliable, statistically rigorous multi-armed bandit experiments."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Daniela Lopes", email = "danielalopes_97@hotmail.com"}]
keywords = ["reinforcement-learning", "bandits", "experimentation", "data-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["plotly>=5.0"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0"]
analysis = ["pandas>=2.0"]
bayes = ["scipy>=1.11"]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "build>=1.2",
    "mypy>=1.8",
    "maturin>=1.15,<2",
    "hypothesis>=6.100",
    "pip-audit>=2.9",
    "psutil>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/danielaLopes/pymab"
Repository = "https://github.com/danielaLopes/pymab"
Issues = "https://github.com/danielaLopes/pymab/issues"
Changelog = "https://github.com/danielaLopes/pymab/blob/main/CHANGELOG.md"
Rust = "https://crates.io/crates/pymab"

[tool.maturin]
bindings = "pyo3"
features = ["extension-module"]
manifest-path = "crates/pymab-python/Cargo.toml"
module-name = "pymab._pymab"
python-source = "src"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/check_notebooks.py" = ["S102"]
"scripts/check_readme_snippets.py" = ["S102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pymab --cov-branch --cov-report=term-missing"
markers = [
    "optional: requires one or more optional dependencies",
]

[tool.coverage.run]
source = ["src/pymab"]
branch = true
omit = ["src/pymab/_reference/**"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
