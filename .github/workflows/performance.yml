name: Native performance

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Fixed Linux comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Install Rust MSRV
        run: |
          rustup toolchain install 1.83.0 --profile minimal
          rustup default 1.83.0
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install benchmark dependencies
        run: uv sync --frozen --python 3.12 --dev
      - name: Build native extension in release mode
        run: uv run maturin develop --release --manifest-path crates/pymab-python/Cargo.toml
      - name: Run isolated backend comparison
        run: uv run python -m benchmarks.run_backends --all --output benchmarks/results/ci.json
      - name: Enforce thresholds and render documentation
        run: >-
          uv run python -m benchmarks.report benchmarks/results/ci.json
          --output docs/source/performance.rst --check-thresholds
      - name: Upload raw and rendered evidence
        uses: actions/upload-artifact@v5
        with:
          name: pymab-native-performance-linux
          path: |
            benchmarks/results/ci.json
            docs/source/performance.rst
          if-no-files-found: error
          retention-days: 30
