name: Deploy PyMAB website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen --python 3.12 --dev --extra docs
      - run: npm ci
        working-directory: web
      - run: npm run format:check && npm run lint && npm run typecheck && npm run test:coverage
        working-directory: web
      - run: make text-check
      - run: npm run build
        working-directory: web
      - run: make docs-html
      - run: uv run python scripts/build_pages_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify deployed routes
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          curl --fail --location --retry 8 --retry-all-errors "${SITE_URL}"
          curl --fail --location --retry 8 --retry-all-errors "${SITE_URL}demo/"
          curl --fail --location --retry 8 --retry-all-errors "${SITE_URL}docs/"
          curl --fail --location --retry 8 --retry-all-errors "${SITE_URL}policies.html"
      - run: npm run e2e -- tests/runtime-smoke.spec.ts --project=chromium
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}demo/
