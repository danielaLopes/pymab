name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - name: Check out the released revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build twine

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          package_version="$(
            python -c \
              "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])"
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi
          echo "package-version=${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify the expected distributions were built
        run: |
          python - <<'PY'
          from pathlib import Path

          distributions = sorted(Path("dist").iterdir())
          wheels = [path for path in distributions if path.suffix == ".whl"]
          sdists = [path for path in distributions if path.name.endswith(".tar.gz")]
          if len(wheels) != 1 or len(sdists) != 1 or len(distributions) != 2:
              names = ", ".join(path.name for path in distributions)
              raise SystemExit(f"Expected one wheel and one sdist; found: {names}")
          PY

      - name: Store release distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test-package:
    name: Test wheel (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download release distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Install the wheel
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: dist/*.whl

      - name: Import package and verify installed version
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.package-version }}
        run: |
          cd "${RUNNER_TEMP}"
          python - <<'PY'
          import os
          from importlib.metadata import version

          import pymab

          expected = os.environ["EXPECTED_VERSION"]
          installed = version("pymab")
          if installed != expected or pymab.__version__ != expected:
              raise SystemExit(
                  f"Expected pymab {expected}; metadata={installed}, "
                  f"module={pymab.__version__}"
              )
          print(f"Installed and imported pymab {installed}")
          PY

  publish:
    name: Publish distributions to PyPI
    needs: test-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymab
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
