name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust MSRV, lint, test, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust 1.83
        run: |
          rustup toolchain install 1.83.0 --profile minimal --component clippy,rustfmt
          rustup default 1.83.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests and documentation tests
        run: cargo test --workspace --all-features --locked

      - name: Compile Criterion benchmarks
        run: cargo bench -p pymab --no-run --locked

      - name: Package and dry-run crates.io publication
        run: |
          cargo package -p pymab --locked
          cargo publish -p pymab --dry-run --locked

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache Cargo audit and registry
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-all-crates: true
      - name: Install pinned cargo-audit
        run: cargo +stable install cargo-audit --version 0.21.2 --locked
      - name: Audit Cargo.lock
        run: cargo +stable audit

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Check formatting
        run: make format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Run lint
        run: make lint

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Run security checks
        env:
          PYMAB_RUN_NETWORK_AUDIT: "1"
        run: make security

  llm-security:
    name: LLM Security Review
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Run LLM security review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_SECURITY_MODEL || 'gpt-5.2' }}
          LLM_SECURITY_FAIL_ON: high
        run: make llm-security

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust MSRV
        run: |
          rustup toolchain install 1.83.0 --profile minimal
          rustup default 1.83.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: python-${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }} --dev --all-extras

      - name: Build release-mode native extension
        run: >-
          uv run maturin develop --release
          --manifest-path crates/pymab-python/Cargo.toml

      - name: Check policy coverage and versions
        if: matrix.python-version == '3.12'
        run: |
          uv run python scripts/check_policy_coverage.py
          uv run python scripts/check_versions.py --require-native

      - name: Run tests
        run: make test

  native-wheels:
    name: Native wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build representative native wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          maturin-version: v1.15.0
          rust-toolchain: 1.83.0
          manylinux: ${{ runner.os == 'Linux' && '2_28' || 'auto' }}
          args: --release --locked --out dist -i python3.12
      - name: Test wheel outside the source tree
        run: python scripts/test_native_wheel.py dist
      - name: Upload representative wheel
        uses: actions/upload-artifact@v5
        with:
          name: pymab-native-wheel-${{ runner.os }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  minimum-dependencies:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimum runtime and test dependencies
        run: |
          python -m pip install --disable-pip-version-check "numpy==1.24.*" hypothesis pytest pytest-cov
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Run core tests
        run: pytest -m "not optional" --no-cov

  docs:
    name: Documentation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install documentation dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }} --dev --extra docs
      - name: Run strict documentation gates
        run: make docs
      - name: Upload rendered documentation
        uses: actions/upload-artifact@v5
        with:
          name: pymab-docs-python-${{ matrix.python-version }}
          path: docs/build/html/
          if-no-files-found: error
          retention-days: 7

  docs-linkcheck:
    name: External documentation links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: uv sync --frozen --python 3.12 --dev --extra docs
      - name: Check external links
        run: make docs-linkcheck

  examples:
    name: Executable examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install all optional dependencies
        run: uv sync --frozen --python 3.12 --dev --all-extras
      - name: Execute Python examples
        run: |
          uv run python examples/bayesian_ucb_bernoulli.py
          uv run python examples/non_stationary_policies.py
          uv run python examples/real_world_scenarios.py
      - name: Execute notebook code cells
        run: uv run python scripts/check_notebooks.py

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust MSRV
        run: |
          rustup toolchain install 1.83.0 --profile minimal
          rustup default 1.83.0

      - name: Install build dependencies
        run: uv sync --frozen --dev

      - name: Verify version declarations agree
        run: |
          uv run python - <<'PY'
          import tomllib

          import pymab
          from docs.source.conf import release as docs_version

          with open("Cargo.toml", "rb") as cargo_file:
              package_version = tomllib.load(cargo_file)["workspace"]["package"]["version"]

          if pymab.__version__ != package_version or docs_version != package_version:
              raise SystemExit(
                  f"Version mismatch: cargo={package_version}, "
                  f"module={pymab.__version__}, docs={docs_version}"
              )
          PY

      - name: Build wheel and source distribution
        run: uv run python -m build

      - name: Validate distribution metadata
        run: uv run twine check --strict dist/*

      - name: Test the built wheel outside the source tree
        run: |
          python -m venv "${RUNNER_TEMP}/pymab-wheel-test"
          "${RUNNER_TEMP}/pymab-wheel-test/bin/python" -m pip install dist/*.whl mypy
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/pymab-wheel-test/bin/python" - <<'PY'
          import numpy as np

          from pymab import (
              BanditEnvironment,
              Experiment,
              ExperimentConfig,
              LoggedBanditDataset,
              estimate_policy_value,
          )
          from pymab.offline import EstimatorConfig
          from pymab.policies import UCBPolicy
          from pymab.statistics import BootstrapConfig

          result = Experiment(
              environment=BanditEnvironment(means=np.array([0.0, 1.0])),
              policies={"ucb": UCBPolicy(n_arms=2)},
              config=ExperimentConfig(horizon=3, n_replicates=2, seed=7),
          ).run()
          assert result.rewards.shape == (2, 3, 1)

          class UniformTarget:
              def probabilities(self, context):
                  return np.array([0.5, 0.5])

          estimate = estimate_policy_value(
              LoggedBanditDataset(
                  actions=np.array([0, 1]),
                  rewards=np.array([0.0, 1.0]),
                  propensities=np.array([0.5, 0.5]),
                  n_arms=2,
              ),
              UniformTarget(),
              config=EstimatorConfig(
                  bootstrap=BootstrapConfig(n_resamples=10),
              ),
          )
          assert estimate.estimate == 0.5
          PY
          "${RUNNER_TEMP}/pymab-wheel-test/bin/python" -m mypy --strict -c '
          import numpy as np
          from pymab import BanditEnvironment, Experiment, ExperimentConfig, SimulationResult
          from pymab.policies import UCBPolicy
          result: SimulationResult = Experiment(
              environment=BanditEnvironment(means=np.array([0.0, 1.0])),
              policies={"ucb": UCBPolicy(n_arms=2)},
              config=ExperimentConfig(horizon=2, n_replicates=1, seed=1),
          ).run()
          '
