name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_as:
        description: Optional version override, for example 2.1.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version override
        id: release_version
        shell: bash
        env:
          REQUESTED_RELEASE: ${{ inputs.release_as }}
        run: |
          set -euo pipefail

          release_as="${REQUESTED_RELEASE}"
          if [[ -z "${release_as}" ]]; then
            workspace_version="$(
              cargo metadata --no-deps --format-version 1 |
                jq -er '[.packages[].version] | unique | if length == 1 then .[0] else error("workspace versions differ") end'
            )"
            if ! git show-ref --verify --quiet "refs/tags/v${workspace_version}"; then
              release_as="${workspace_version}"
            fi
          fi
          echo "release_as=${release_as}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Update Cargo workspace release and changelog
        shell: bash
        env:
          RELEASE_AS: ${{ steps.release_version.outputs.release_as }}
          RELEASE_PLEASE_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail

          args=(
            release-pr
            --token="${RELEASE_PLEASE_TOKEN}"
            --repo-url="${GITHUB_REPOSITORY}"
            --target-branch="${GITHUB_REF_NAME}"
            --config-file=release-please-config.json
            --manifest-file=.release-please-manifest.json
          )
          if [[ -n "${RELEASE_AS}" ]]; then
            args+=(--release-as="${RELEASE_AS}")
          fi

          npx --yes release-please@17.6.0 "${args[@]}"
